<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MarginNote Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header id="topbar" class="topbar">
        <div class="topbar-row">
          <span id="statusDot" class="status-dot" role="status" aria-label="Host 连接状态"></span>

          <button
            id="conversationButton"
            class="conversation-button"
            type="button"
            aria-haspopup="true"
            aria-expanded="false"
            title="切换对话"
          >
            <span id="conversationTitle">新对话</span>
            <svg class="chevron" width="12" height="12" viewBox="0 0 12 12" aria-hidden="true">
              <path
                d="M3 4.5 6 7.5 9 4.5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.6"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>

          <div id="contextWindow" class="context-window">
            <button
              id="topbarToggle"
              class="context-chip"
              type="button"
              aria-expanded="false"
              aria-controls="topbarBody"
              title="上下文窗口用量"
            >
              <svg class="context-ring" width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
                <circle class="context-ring-track" cx="8" cy="8" r="6" />
                <circle id="contextRingValue" class="context-ring-value" cx="8" cy="8" r="6" />
              </svg>
              <span id="contextPercent" class="context-chip-value">--</span>
            </button>
          </div>

          <button
            id="newConversationButton"
            class="icon-button"
            type="button"
            aria-label="新建对话"
            title="新建对话"
          >
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 3.2v9.6M3.2 8h9.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>

        <div id="topbarBody" class="topbar-body" hidden>
          <div class="context-bar" aria-hidden="true">
            <span id="contextBarFill" class="context-bar-fill"></span>
          </div>
          <span id="contextUsage" class="topbar-detail">正在读取当前会话</span>
          <p id="statusText" class="topbar-detail">正在连接 Host…</p>
        </div>
      </header>

      <div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
      <aside id="conversationDrawer" class="conversation-drawer" hidden>
        <div class="drawer-header">
          <strong>对话</strong>
          <button
            id="drawerNewConversationButton"
            class="icon-button"
            type="button"
            aria-label="新建对话"
            title="新建对话"
          >
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 3.2v9.6M3.2 8h9.6"
                fill="none"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
        <div id="conversationList" class="conversation-list"></div>
      </aside>

      <div class="messages-wrap">
        <section id="messages" class="messages" aria-live="polite"></section>
        <button id="scrollBottomButton" class="scroll-bottom" type="button" hidden aria-label="回到底部">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true">
            <path
              d="M8 3.5v9m0 0 3.5-3.5M8 12.5 4.5 9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.7"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </div>

      <form id="composer" class="composer">
        <textarea
          id="messageInput"
          rows="1"
          required
          placeholder="问点什么，或让 Agent 读文档、记笔记…"
        ></textarea>

        <div class="composer-actions">
          <div id="settingsMenuContainer" class="settings-menu-container">
            <button
              id="settingsMenuButton"
              class="composer-action-button"
              type="button"
              aria-label="对话设置"
              aria-controls="settingsMenu"
              aria-expanded="false"
              title="对话设置"
            >
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <circle cx="3.5" cy="8" r="1.3" fill="currentColor" />
                <circle cx="8" cy="8" r="1.3" fill="currentColor" />
                <circle cx="12.5" cy="8" r="1.3" fill="currentColor" />
              </svg>
            </button>
            <div id="settingsMenu" class="settings-menu" role="menu" hidden>
              <button
                id="autoApproveButton"
                class="settings-menu-item"
                type="button"
                role="menuitemcheckbox"
                aria-checked="false"
              >
                <span>自动接受编辑</span>
                <span class="settings-check" aria-hidden="true">
                  <svg width="14" height="14" viewBox="0 0 16 16">
                    <path
                      d="m3.5 8.4 3 3 6-6.8"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
              </button>
            </div>
          </div>

          <span id="composerHint" class="composer-hint">Enter 发送 · Shift + Enter 换行</span>

          <button id="sendButton" class="send-button" type="submit" aria-label="发送">
            <svg class="send-icon" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path
                d="M8 12.8V3.6m0 0L4.2 7.4M8 3.6l3.8 3.8"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span class="send-spinner" aria-hidden="true"></span>
          </button>
        </div>
      </form>
    </main>
    <script src="/marked.min.js"></script>
    <script src="/purify.min.js"></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
